name: Verify Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version to verify
        required: true
      tools_tag:
        description: Private release containing validation-tools.zip
        required: true
      phase:
        description: Candidate lifecycle gate or live public updater check
        type: choice
        options:
          - candidate
          - live
        default: candidate
      upload_artifacts:
        description: Also retain full log files when artifact storage is available
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download private compiler and bundled prerequisite fixtures
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_TAG: ${{ inputs.tools_tag }}
        run: |
          New-Item -ItemType Directory native/Build/ReleaseValidation -Force | Out-Null
          gh release download $env:TOOLS_TAG --repo $env:GITHUB_REPOSITORY --pattern validation-tools.zip --dir native/Build/ReleaseValidation
          if ($LASTEXITCODE) { throw 'Validation tool download failed.' }
          Expand-Archive native/Build/ReleaseValidation/validation-tools.zip native/Build/ReleaseValidation/Tools
      - name: Verify exact signed public candidate and installer lifecycle
        if: inputs.phase != 'live'
        shell: powershell
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          & native/VerifyReleaseCandidate.ps1 -Version $env:RELEASE_VERSION -ToolsRoot native/Build/ReleaseValidation/Tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify live public updater on clean Windows
        if: inputs.phase == 'live'
        shell: powershell
        run: |
          & native/Launcher/VerifyPublishedBeta.ps1 -ReceiptPath native/Build/ReleaseValidation/Tools/ExpectedInstaller.json -Headless
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Return verification receipts and diagnostics through job logs
        if: always()
        shell: powershell
        run: |
          $taskReceipts = @(Get-ChildItem native/Build/ReleaseValidation/result.json,native/Build/OnlineInstallerVerification/*/result.json -ErrorAction SilentlyContinue)
          foreach ($taskReceipt in $taskReceipts) {
            $taskEncoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($taskReceipt.FullName))
            Write-Output "WILDLINE_VERIFICATION_RESULT=$taskEncoded"
          }
          Get-ChildItem native/Build/InstallerVerification,native/Build/VersionedSetupVerification,native/Build/OnlineInstallerVerification -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output ("Diagnostic tail: " + $_.FullName)
            Get-Content -LiteralPath $_.FullName -Tail 12
          }
      - uses: actions/upload-artifact@v4
        if: always() && inputs.upload_artifacts
        continue-on-error: true
        with:
          name: release-verification
          path: |
            native/Build/Beta/InstallerVerification.json
            native/Build/ReleaseValidation/result.json
            native/Build/ReleaseValidation/*.log
            native/Build/InstallerVerification/**/*.log
            native/Build/VersionedSetupVerification/**/*.log
            native/Build/OnlineInstallerVerification/**/*.log
            native/Build/OnlineInstallerVerification/**/result.json
            ~/AppData/Local/Wildline/LauncherLogs/*.log
            ~/AppData/Local/Wildline/Updates/**/install.log
          retention-days: 30
